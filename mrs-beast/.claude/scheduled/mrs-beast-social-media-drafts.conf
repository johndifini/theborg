# Runner config for the mrs-beast-social-media-drafts scheduled task.
# Sourced by .bin/run-scheduled-task.sh after its defaults, so it overrides them.
#
# The task surveys shipped work across BOTH the workspace and the WAIQ repo
# under repos/, neither of which lives inside the mrs-beast agent dir the runner
# cd's into. Grant the workspace root so the file tools can read them; the task
# is read-only with respect to both repos and writes only its own state file.
EXTRA_ARGS=(--add-dir "$BORG_ROOT")
