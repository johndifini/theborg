    path: architetto/AGENTS.md
    type: always_on_instruction
    status: draft
    owner: architetto
    scope: architetto
    visibility: public
    canonicality: canonical
    introduced: 2026-07-12    # first git add
    load_mode: always
    consumers: [claude-code, codex, claude-desktop]
    review:
      cadence: monthly
      last_reviewed: null
      method: [semantic, best_practice]
    related: []

